# Runs on every push and pull request. No secrets are used or needed.
#
#   check  install exactly what the lockfile pins, then lint, type-check and run the
#          unit tests. This is the job the README badge reports.
#   docs   npm run check:docs: every documentation link the app ships is still live.
#          It needs no secrets, but it depends on third-party doc sites being up, so
#          it runs as its own job and a failure is reported without turning CI red.
#
# Not run here: npm run check:erasure. It needs the Supabase service-role key and
# writes to the real database, so it is run by hand (see docs/testing-strategy.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an in-progress run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: a slow or briefly-down doc site must not fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # check-doc-sources.mjs uses only Node built-ins, so no npm install is needed.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check documentation sources
        run: npm run check:docs
